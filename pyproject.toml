[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trailcam-dl"
version = "0.1.0"
description = "Offener Client für die Wi-Fi-TrailCam (PPCS/EasyCam)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
progress = ["rich>=13"]
ble = ["bleak>=0.21"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3"]

[project.scripts]
trailcam = "trailcam.cli:main"

[tool.setuptools.packages.find]
include = ["trailcam*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["trailcam"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["hardware: braucht echte Mitschnitte in captures/ (in CI übersprungen)"]

[[tool.mypy.overrides]]
module = ["cryptography.*", "dotenv.*", "rich.*", "bleak.*"]
ignore_missing_imports = true
